<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#101d24" />
<meta name="apple-mobile-web-app-title" content="Questions V2" />
<title>Questions V2</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101d24'/%3E%3Ctext x='50' y='72' font-size='62' font-family='Georgia,serif' fill='%23e9c46a' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23101d24'/%3E%3Ctext x='50' y='72' font-size='62' font-family='Georgia,serif' fill='%23e9c46a' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E" />
<style>
@font-face {
  font-family: 'Newsreader';
  font-style: normal;
  font-weight: 300 600;
  font-display: swap;
  src: url(newsreader-300.woff2) format('woff2');
}
@font-face {
  font-family: 'DM Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(dm-mono-400.woff2) format('woff2');
}

:root {
  --font-heading: 'Newsreader', Georgia, serif;
  --font-body: 'Newsreader', Georgia, serif;
  --font-mono: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --color-bg: #101d24;
  --color-surface: #1a3039;
  --color-text: #e8ece9;
  --color-accent: #e9c46a;
  --color-accent-2: #2a9d8f;
  --color-accent-100: #fdf6e6;
  --color-accent-200: #f8e8c2;
  --color-accent-300: #f2d99a;
  --color-accent-400: #e9c46a;
  --color-accent-500: #d0a94c;
  --color-accent-600: #a9873a;
  --color-accent-700: #80662c;
  --color-accent-800: #57461f;
  --color-accent-900: #332913;
  --color-accent-2-100: #e4f5f2;
  --color-accent-2-200: #bfe6e0;
  --color-accent-2-300: #8fd3ca;
  --color-accent-2-400: #56b8ab;
  --color-accent-2-500: #2a9d8f;
  --color-accent-2-600: #217f74;
  --color-accent-2-700: #1a6159;
  --color-accent-2-800: #14453f;
  --color-accent-2-900: #0f2b28;
  --color-neutral-100: #eef2f1;
  --color-neutral-200: #d6dedd;
  --color-neutral-300: #b4c1c2;
  --color-neutral-400: #8ea0a4;
  --color-neutral-500: #6d8086;
  --color-neutral-600: #56686e;
  --color-neutral-700: #405056;
  --color-neutral-800: #2c3a40;
  --color-neutral-900: #1c272c;
  --color-warm: #f4a261;
  --color-hot: #e76f51;
  --color-divider: var(--color-neutral-700);
  --color-muted: color-mix(in srgb, var(--color-text) 72%, transparent);
  --shadow-sm: 0 0 0 1px #2c3a40;
  --shadow-md: 0 0 0 1px #405056, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #6d8086, 0 16px 40px rgba(0,0,0,0.65);
  --radius-lg: 8px;
  --radius-md: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  min-height: 100vh;
  min-height: 100svh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + clamp(20px, 4vw, 56px)) 18px calc(env(safe-area-inset-bottom, 0px) + 40px);
  -webkit-font-smoothing: antialiased;
}

.rail { width: 100%; max-width: 840px; display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; }
.deck-col {
  flex: 1 1 420px; max-width: 480px; min-width: 300px; display: flex; flex-direction: column; gap: 20px;
  container-type: inline-size; container-name: deck;
}
.saved-col { flex: 1 1 280px; max-width: 340px; min-width: 260px; display: flex; flex-direction: column; gap: 14px; }
.setup-row { flex: 1 0 100%; display: flex; justify-content: center; padding-top: 8px; }

.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-muted); }
h1 { font-family: var(--font-heading); font-weight: 500; font-size: 20px; margin: 0; }
h4 { font-family: var(--font-heading); font-weight: 500; font-size: 17px; margin: 0; }

/* buttons */
.btn {
  font-family: var(--font-body); font-size: 13px; cursor: pointer;
  border-radius: var(--radius-lg); padding: 12px 16px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 100ms ease;
  background: transparent; color: var(--color-text); border: 1px solid var(--color-neutral-700);
}
.btn:hover { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn:active { transform: translateY(1px); background: color-mix(in srgb, var(--color-accent-400) 16%, transparent); }
.btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.btn-primary { border-color: var(--color-accent); color: var(--color-text); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 16%, transparent); }
.btn-secondary { border-color: var(--color-neutral-700); }
.btn-ghost { border: none; padding: 6px 4px; min-height: 0; color: color-mix(in srgb, var(--color-text) 65%, transparent); font-size: 12px; }
.btn-ghost:hover { border: none; background: none; color: var(--color-accent); }
.btn-icon { padding: 6px; min-height: 44px; min-width: 44px; border: none; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.btn-icon:hover { border: none; background: none; color: var(--color-accent); }
.btn-block { width: 100%; }
.row2 { display: grid; gap: 9px; }
.row2.cols-2 { grid-template-columns: 1fr 1fr; }
.row2.cols-1 { grid-template-columns: 1fr; }

/* segmented vibe filter */
.seg {
  display: flex; align-self: flex-start; border-radius: var(--radius-md); overflow: hidden;
  background-color: var(--color-surface);
  box-shadow: var(--shadow-sm);
}
.seg-opt {
  display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 7px 12px;
  font-size: 13px; color: color-mix(in srgb, var(--color-text) 55%, transparent);
  transition: color 140ms ease, background 140ms ease, box-shadow 140ms ease;
}
.seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
.seg-opt:has(input:checked) { color: var(--color-text); background: color-mix(in srgb, var(--color-accent) 10%, transparent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg-opt:hover { color: var(--color-text); }
.seg-opt:first-of-type { border-top-left-radius: calc(var(--radius-md) - 1px); border-bottom-left-radius: calc(var(--radius-md) - 1px); }
.seg-opt:last-of-type { border-top-right-radius: calc(var(--radius-md) - 1px); border-bottom-right-radius: calc(var(--radius-md) - 1px); }

/* card stack */
.stack { position: relative; padding-bottom: 14px; }
.qd-glow {
  position: absolute; inset: -18% -12% 8%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(50% 50% at 30% 35%, var(--color-accent-2) 0%, transparent 70%),
              radial-gradient(46% 46% at 78% 68%, var(--color-accent) 0%, transparent 72%);
  filter: blur(46px); opacity: 0.4;
}
.ghost { position: absolute; inset: 0 0 auto 0; height: 100%; border-radius: var(--radius-lg); }
.ghost.g1 { background: var(--color-neutral-900); transform: translateY(14px) scale(0.95); opacity: 0.5; }
.ghost.g2 { background: var(--color-neutral-800); transform: translateY(7px) scale(0.975); opacity: 0.7; }

.qd-card {
  position: relative; background-color: color-mix(in srgb, var(--color-surface) 68%, transparent);
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIiBmaWx0ZXI9InVybCgjbikiIG9wYWNpdHk9IjAuNSIvPjwvc3ZnPg=="),
    radial-gradient(120% 90% at 12% 0%, color-mix(in srgb, var(--color-accent-2-800) 55%, transparent) 0%, transparent 62%),
    linear-gradient(168deg, color-mix(in srgb, var(--color-neutral-100) 4%, transparent) 0%, transparent 45%);
  background-blend-mode: overlay, normal, normal;
  background-size: 140px 140px, auto, auto;
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  backdrop-filter: blur(20px) saturate(1.5);
  border-radius: var(--radius-lg); padding: 26px 24px 22px; min-height: 260px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--shadow-lg), inset 0 1px 0 color-mix(in srgb, var(--color-neutral-100) 9%, transparent);
  animation: qdRise 420ms cubic-bezier(0.2, 0.8, 0.25, 1);
  touch-action: pan-y; cursor: grab; will-change: transform; user-select: none;
}
.qd-card:active { cursor: grabbing; }
@keyframes qdRise { from { opacity: 0; transform: translateY(14px) rotate(-0.4deg); } to { opacity: 1; transform: none; } }

.qd-verdict {
  position: absolute; top: 20px; pointer-events: none; opacity: 0;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 7px 12px; border-radius: var(--radius-lg); border: 1px solid currentColor;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.qd-back { left: 20px; color: var(--color-neutral-400); }
.qd-next { right: 20px; color: var(--color-accent-2); }

.card-top { display: flex; align-items: center; justify-content: space-between; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.tag-outline { padding: 6px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--color-text) 35%, transparent); color: color-mix(in srgb, var(--color-text) 80%, transparent); }
.star-btn { background: none; border: none; cursor: pointer; padding: 2px; color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.star-btn:hover { color: var(--color-accent); }

.qd-q { font-family: var(--font-heading); font-weight: 400; font-size: 24px; line-height: 1.3; letter-spacing: -0.01em; margin: 24px 0 20px; text-wrap: balance; view-transition-name: qd-question; }
@container deck (min-width: 400px) {
  .qd-q { font-size: 30px; }
  .qd-card { padding: 32px 30px 26px; min-height: 300px; }
}
@container deck (max-width: 340px) {
  .qd-q { font-size: 20px; }
  .row2 { grid-template-columns: 1fr !important; }
}
.hr { height: 1px; background: color-mix(in srgb, var(--color-text) 14%, transparent); margin: 0 0 12px; }
.qd-meta { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); view-transition-name: qd-meta; }

@keyframes qdVtOut { to { opacity: 0; transform: translateY(-10px) scale(0.98); filter: blur(3px); } }
@keyframes qdVtIn { from { opacity: 0; transform: translateY(14px) scale(0.98); filter: blur(3px); } }
::view-transition-old(qd-question) { animation: qdVtOut 200ms cubic-bezier(0.4,0,1,1) both; }
::view-transition-new(qd-question) { animation: qdVtIn 340ms cubic-bezier(0.2,0.8,0.25,1) both; }
::view-transition-old(qd-meta) { animation: qdVtOut 160ms ease-in both; }
::view-transition-new(qd-meta) { animation: qdVtIn 260ms ease-out both; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(qd-question), ::view-transition-new(qd-question),
  ::view-transition-old(qd-meta), ::view-transition-new(qd-meta) { animation: none !important; }
}

.note { font-size: 12px; color: var(--color-muted); text-align: center; min-height: 30px; line-height: 1.5; }
.meta { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); }

.empty { background: var(--color-surface); border: 1px dashed var(--color-divider); border-radius: var(--radius-lg); padding: 34px 24px; text-align: center; }
.empty p { font-family: var(--font-heading); font-weight: 400; font-size: 20px; margin: 0 0 18px; }
.empty.small { padding: 28px 20px; }
.empty.small p { font-size: 17px; margin: 0 0 8px; }
.empty .btnrow { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }

.saved-list { display: flex; flex-direction: column; gap: 8px; }
.saveditem { background: var(--color-surface); box-shadow: var(--shadow-sm); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.savedtext { font-family: var(--font-heading); font-weight: 400; font-size: 14px; line-height: 1.4; margin: 0; }
.saveditem .btn-icon { min-width: 28px; min-height: 28px; width: 28px; height: 28px; flex: none; }

.hidden { display: none !important; }
button:focus-visible, a:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.setuplink { text-decoration: none; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 62%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 22%, transparent); padding-bottom: 3px; }
.setuplink:hover { color: var(--color-accent); border-color: var(--color-accent); }
@media (display-mode: standalone) { .setuplink { display: none; } }

/* ------------ add panel ------------ */
.add-panel {
  background: var(--color-surface); border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg); padding: 18px 18px 14px; display: flex;
  flex-direction: column; gap: 12px;
}
.add-panel textarea {
  width: 100%; min-height: 72px; resize: vertical; background: transparent;
  border: 1px solid var(--color-neutral-700); border-radius: var(--radius-lg);
  padding: 10px 12px; font-family: var(--font-heading); font-size: 15px;
  color: var(--color-text); outline: none; line-height: 1.4;
}
.add-panel textarea:focus { border-color: var(--color-accent); }
.add-panel textarea::placeholder { color: color-mix(in srgb, var(--color-text) 38%, transparent); }
.add-panel-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.add-panel-actions { display: flex; gap: 8px; }
.panel-error { font-size: 12px; color: var(--color-warm); min-height: 16px; }
.music-check { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); cursor: pointer; }
.music-check input { accent-color: var(--color-accent-2); width: 14px; height: 14px; }
/* seed mode */
.panel-mode-toggle { display: flex; gap: 0; }
.panel-mode-toggle label {
  flex: 1; text-align: center; cursor: pointer; padding: 6px 10px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent);
  background: var(--color-neutral-900); border: 1px solid var(--color-neutral-700);
  transition: background 140ms, color 140ms;
}
.panel-mode-toggle label:first-of-type { border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
.panel-mode-toggle label:last-of-type  { border-radius: 0 var(--radius-lg) var(--radius-lg) 0; border-left: none; }
.panel-mode-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.panel-mode-toggle label:has(input:checked) { color: var(--color-text); background: color-mix(in srgb, var(--color-accent) 12%, transparent); border-color: var(--color-accent); }
/* variant cards */
.variants { display: flex; flex-direction: column; gap: 10px; }
.variant-card {
  background: var(--color-neutral-900); border: 1px solid var(--color-neutral-700);
  border-radius: var(--radius-lg); padding: 14px 14px 10px; cursor: pointer;
  transition: border-color 140ms, background 140ms;
}
.variant-card:hover { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 6%, transparent); }
.variant-card p { font-family: var(--font-heading); font-size: 15px; line-height: 1.4; margin: 0 0 8px; }
.variant-card .btn { font-size: 12px; padding: 6px 12px; min-height: 0; }
/* my questions list in saved col */
.my-q-section { display: flex; flex-direction: column; gap: 10px; }
.my-q-header { display: flex; align-items: center; justify-content: space-between; }
.my-q-list { display: flex; flex-direction: column; gap: 8px; }
.my-q-item { background: var(--color-surface); box-shadow: var(--shadow-sm); border-radius: var(--radius-lg); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; }
.my-q-text { font-family: var(--font-heading); font-weight: 400; font-size: 13px; line-height: 1.4; margin: 0; flex: 1; color: color-mix(in srgb, var(--color-text) 88%, transparent); }
.my-q-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); display: block; margin-top: 3px; }
.my-q-btns { display: flex; gap: 2px; flex: none; }
.my-q-btns .btn-icon { min-width: 28px; min-height: 28px; width: 28px; height: 28px; flex: none; }

@media (prefers-reduced-motion: reduce) {
  .qd-card { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="rail">

  <div class="deck-col" id="deckCol">
    <div class="header-row">
      <span class="eyebrow">Take turns. One question at a time.</span>
      <button class="btn btn-ghost" id="toggleView">Saved (0)</button>
    </div>

    <div class="seg" id="vibes"></div>

    <div id="cardHost" aria-live="polite" aria-atomic="true"></div>

    <div style="display:flex; flex-direction:column; gap:9px;">
      <button class="btn btn-primary btn-block" id="nextBtn">
        Next question
        <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>
      </button>
      <div class="row2 cols-2" id="secondaryRow">
        <button class="btn btn-secondary" id="passBtn">
          Pass this one
          <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96ZM192,208H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>
        </button>
        <button class="btn btn-secondary" id="genBtn">
          <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M197.58,129.06,146,110l-19-51.62a15.92,15.92,0,0,0-29.88,0L78,110l-51.62,19a15.92,15.92,0,0,0,0,29.88L78,178l19,51.62a15.92,15.92,0,0,0,29.88,0L146,178l51.62-19a15.92,15.92,0,0,0,0-29.88ZM137,164.22a8,8,0,0,0-4.74,4.74L112,223.85,91.78,169A8,8,0,0,0,87,164.22L32.15,144,87,123.78A8,8,0,0,0,91.78,119L112,64.15,132.22,119a8,8,0,0,0,4.74,4.74L191.85,144ZM144,40a8,8,0,0,1,8-8h16V16a8,8,0,0,1,16,0V32h16a8,8,0,0,1,0,16H184V64a8,8,0,0,1-16,0V48H152A8,8,0,0,1,144,40ZM248,88a8,8,0,0,1-8,8h-8v8a8,8,0,0,1-16,0V96h-8a8,8,0,0,1,0-16h8V72a8,8,0,0,1,16,0v8h8A8,8,0,0,1,248,88Z"/></svg>
          <span id="genLabel">Write new ones</span>
        </button>
      </div>
    </div>

    <div class="note" id="note"></div>

    <div class="meta">
      <span id="counter"></span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-ghost" id="reshuffleBtn">Reshuffle deck</button>

const store = {
  async load() {
    if (window.storage) {
      try { const r = await window.storage.get(KEY); return r && r.value ? JSON.parse(r.value) : null; }
      catch (e) { return null; }
    }
    try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  },
  async save(obj) {
    const s = JSON.stringify(obj);
    if (window.storage) { try { await window.storage.set(KEY, s); } catch (e) {} return; }
    try { localStorage.setItem(KEY, s); } catch (e) {}
  }
};

let state = { vibe: "mixed", generated: [], used: [], retired: [], saved: [], custom: [] };

let historyIndex = -1;

function matches(q, v) {
  if (v === "mixed") return true;
  if (v === "music") return q.topic === "music";
  return q.vibe === v;
}

const VIBES = [["playful", "Playful"], ["deep", "Deep"], ["music", "Music"], ["mixed", "Mixed"]];

function vibeLabel(v) {
  const hit = VIBES.filter(o => o[0] === v)[0];
  return hit ? hit[1] : v;
}

function poolTotal() {
  return all().filter(q => matches(q, state.vibe) && state.retired.indexOf(q.id) === -1).length;
}

function pool(excludeId) {
  return all().filter(q =>
    matches(q, state.vibe) &&
    state.used.indexOf(q.id) === -1 &&
    state.retired.indexOf(q.id) === -1 &&
    q.id !== excludeId
  );
}

function draw(excludeId) {
  const p = pool(excludeId);
  if (!p.length) { current = null; render(); return; }
  current = p[Math.floor(Math.random() * p.length)];
  if (state.used.indexOf(current.id) === -1) state.used.push(current.id);
  history = history.slice(0, historyIndex + 1);
  history.push(current);
  historyIndex = history.length - 1;
  persist();
  render();
}

/* ---------------- reduced motion / view transitions ---------------- */
function reduceMotion() {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
}

function withTransition(fn) {
  if (!document.startViewTransition || reduceMotion()) { fn(); return; }
  document.startViewTransition(() => fn());
}

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* ---------------- actions ---------------- */
function setVibe(v) {
  lastPass = null;
  state.vibe = v;
  history = []; historyIndex = -1;
  if (!current || !matches(current, v)) draw(null);
  else { persist(); render(); }
}

function next() {
  lastPass = null;
  note = "";
  if (historyIndex < history.length - 1) {
    historyIndex++;
    current = history[historyIndex];
    render();
    return;
  }
  draw(current ? current.id : null);
}

function back() {
  lastPass = null;
  if (historyIndex <= 0) { render(); return; }
  historyIndex--;
  current = history[historyIndex];
  render();
}

function pass() {
  if (!current) return;
  const passedQuestion = current;
  const wasSaved = state.saved.find(s => s.id === passedQuestion.id) || null;
  state.retired.push(passedQuestion.id);
  state.saved = state.saved.filter(s => s.id !== passedQuestion.id);
  lastPass = { question: passedQuestion, wasSaved };
  note = "Passed. That one is out of the deck for good.";
  draw(passedQuestion.id);
}

function undoPass() {
  if (!lastPass) return;
  const question = lastPass.question, wasSaved = lastPass.wasSaved;
  state.retired = state.retired.filter(id => id !== question.id);
  if (wasSaved) state.saved.push(wasSaved);
  current = question;
  history = history.slice(0, historyIndex + 1);
  history.push(current);
  historyIndex = history.length - 1;
  if (state.used.indexOf(current.id) === -1) state.used.push(current.id);
  lastPass = null;
  note = "Question restored.";
  persist(); render();
}

function toggleSave() {
  if (!current) return;
  lastPass = null;
  const on = state.saved.some(s => s.id === current.id);
  if (on) {
    state.saved = state.saved.filter(s => s.id !== current.id);
    note = "Removed from saved.";
  } else {
    state.saved.push({ id: current.id, text: current.text, vibe: current.vibe });
    note = CAN_GENERATE ? "Saved. New questions will lean this direction." : "Saved.";
  }
  persist(); render();
}

function removeSaved(id) {
  state.saved = state.saved.filter(s => s.id !== id);
  persist(); render();
}

function viewSaved(id) {
  const s = state.saved.find(x => x.id === id);
  if (!s) return;
  lastPass = null;
  current = all().find(x => x.id === id) || { id: s.id, text: s.text, vibe: s.vibe, topic: null };
  history = history.slice(0, historyIndex + 1);
  history.push(current);
  historyIndex = history.length - 1;
  if (state.used.indexOf(current.id) === -1) state.used.push(current.id);
  note = "";
  if (!isWide) view = "deck";
  persist(); render();
}

  lastPass = null;
  state.used = [];
  history = []; historyIndex = -1;
  note = "Deck reshuffled. Everything you didn't pass is back in play.";
  draw(null);
}

/* ---------- worker call helper ---------- */
async function callWorker(route, body) {
  const resp = await fetch(WORKER_URL + route, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || "Worker error " + resp.status);
  }
  return resp.json();
}

function buildBatchPrompt(vibeLine, taste, recent) {
  return [
    "You write open ended questions for a married couple doing a Gottman informed check in. They take turns asking each other one question at a time.",
    "The couple are college-educated millennials into 90s and current R&B and 2010s+ hip hop -- keep references and tone natural to that world when relevant, never forced.",
    "", "Generate 8 new questions.", "Vibe: " + vibeLine, "", "Rules:",
    "- Open ended. Never answerable with yes or no.",
    "- One sentence, addressed to the partner as you.",
    "- Specific and vivid, not generic self help phrasing.",
    "- No therapy jargon, no clinical language, no em dashes.",
    "- Fun ones should be genuinely funny, not cute.",
    taste.length ? "\nThe couple saved these as favorites. Match this taste:\n" + taste.map(t => "- " + t).join("\n") : "",
    recent.length ? "\nDo not repeat or closely mirror these:\n" + recent.map(t => "- " + t).join("\n") : "",
    "", 'Return only a JSON array: [{"text": "...", "vibe": "playful"}]',
    'vibe must be either "playful" or "deep".'
  ].join("\n");
}

async function generate() {
  lastPass = null;
  busy = true; note = ""; render();
  const taste = state.saved.slice(-10).map(s => s.text);
  const recent = state.used.map(id => all().find(q => q.id === id)).filter(Boolean).slice(-25).map(q => q.text);
  const vibeLine = state.vibe === "playful"
    ? "Light, funny, curious. Nothing heavy."
    : state.vibe === "deep"
      ? "Reflective and revealing, the kind that opens a long conversation."
      : state.vibe === "music"
        ? "Every question must be about music. Songs, albums, concerts, artists, what music does to them, what it meant at different points in their life. Mix light ones with a few that go deep."
        : "Half light and funny, half reflective and revealing.";

  try {
    let parsed;
    if (WORKER_URL) {
      const data = await callWorker("/batch", { prompt: buildBatchPrompt(vibeLine, taste, recent) });
      parsed = data.questions;
    } else {
      const prompt = buildBatchPrompt(vibeLine, taste, recent);
      const text = await window.claude.complete({ messages: [{ role: "user", content: prompt }], max_tokens: 1200 });
      const clean = text.replace(/```json|```/g, "").trim();
      parsed = JSON.parse(clean);
    }
    const stamp = Date.now();
    const fresh = parsed.filter(q => q && typeof q.text === "string").map((q, i) => ({
      id: "g" + stamp + "-" + i,
      text: q.text.trim(),
      vibe: q.vibe === "deep" ? "deep" : "playful",
      topic: state.vibe === "music" ? "music" : null,
      fresh: true
    }));
    if (!fresh.length) throw new Error("empty");
    state.generated = state.generated.concat(fresh);
    const match = fresh.filter(q => matches(q, state.vibe));
    current = (match.length ? match : fresh)[0];
    state.used.push(current.id);
    note = "Added " + fresh.length + " fresh questions to the deck.";
    persist();
  } catch (e) {
    note = "Couldn't reach the question writer. Check your connection and try again.";
  }
  busy = false; render();
}

/* ---------- add / seed panel state ---------- */
let addPanelOpen = false;
let addPanelMode = "manual"; // "manual" | "seed"
let addEditId = null;        // id of custom question being edited, or null
let seedPending = null;      // [{text, vibe}] during variant selection, or null
let addBusy = false;

function toggleAddPanel() {
  addPanelOpen = !addPanelOpen;
  if (!addPanelOpen) { addEditId = null; seedPending = null; addBusy = false; }
  render();
}

function openEditCustom(id) {
  addEditId = id;
  addPanelMode = "manual";
  seedPending = null;
  addPanelOpen = true;
  render();
  const ta = el("addTextarea");
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

function deleteCustom(id) {
  state.custom = state.custom.filter(q => q.id !== id);
  state.saved   = state.saved.filter(s => s.id !== id);
  state.used    = state.used.filter(u => u !== id);
  state.retired = state.retired.filter(r => r !== id);
  history = history.filter(h => h.id !== id);
  historyIndex  = Math.min(historyIndex, history.length - 1);
  if (current && current.id === id) { current = null; draw(null); return; }
  persist(); render();
}

function commitCustom(text, vibe, music, seed) {
  const trimmed = text.trim();
  const errEl = el("addError");
  if (!trimmed) { if (errEl) errEl.textContent = "Question can't be blank."; return; }
  if (trimmed.length > 240) { if (errEl) errEl.textContent = "Keep it under 240 characters."; return; }
  const lower = trimmed.toLowerCase();
  const dupe = all().some(q => q.id !== addEditId && q.text.toLowerCase() === lower);
  if (dupe) { if (errEl) errEl.textContent = "That question is already in the deck."; return; }

  if (addEditId) {
    const idx = state.custom.findIndex(q => q.id === addEditId);
    if (idx !== -1) {
      state.custom[idx].text  = trimmed;
      state.custom[idx].vibe  = vibe;
      state.custom[idx].topic = music ? "music" : null;
      if (seed) state.custom[idx].seed = seed;
    }
    // keep saved copy in sync
    const si = state.saved.findIndex(s => s.id === addEditId);
    if (si !== -1) state.saved[si].text = trimmed;
  } else {
    const q = { id: "c" + Date.now(), text: trimmed, vibe, topic: music ? "music" : null, createdAt: Date.now() };
    if (seed) q.seed = seed;
    state.custom.push(q);
  }

  seedPending = null;
  addEditId = null;
  addPanelOpen = false;
  note = addEditId ? "Question updated." : "Question added to the deck.";
  persist(); render();
}

async function runSeed() {
  const ta = el("addTextarea");
  if (!ta) return;
  const seedText = ta.value.trim();
  const errEl = el("addError");
  if (!seedText) { if (errEl) errEl.textContent = "Enter a rough idea first."; return; }

  const vibeEl = el("addVibeSeed");
  const seedVibe = vibeEl ? vibeEl.value : "playful";
  const musicEl = document.getElementById("addMusicSeed");
  const seedMusic = musicEl ? musicEl.checked : false;

  addBusy = true;
  if (errEl) errEl.textContent = "";
  renderAddPanel();

  const vibeLine = seedVibe === "playful" ? "Light, funny, curious. Nothing heavy."
    : "Reflective and revealing, the kind that opens a long conversation.";
  const prompt = [
    "You write open ended questions for a married couple doing a Gottman informed check in.",
    "The couple are college-educated millennials into 90s and current R&B and 2010s+ hip hop.",
    "Rough idea from the user: " + seedText,
    "Vibe: " + vibeLine,
    seedMusic ? "Every variant must be about music." : "",
    "", "Write exactly 3 genuinely distinct open-ended questions based on this idea.",
    "Each should feel like a different angle, not three rewordings.",
    "Rules: open ended, one sentence, addressed to the partner as you, specific and vivid,",
    "no therapy jargon, no em dashes, no clinical language.",
    "", 'Return only a JSON array: [{"text": "...", "vibe": "playful"}, ...]',
    'vibe must be "playful" or "deep".'
  ].filter(Boolean).join("\n");

  try {
    let variants;
    if (WORKER_URL) {
      const data = await callWorker("/seed", { prompt });
      variants = data.variants;
    } else if (window.claude && typeof window.claude.complete === "function") {
      const raw = await window.claude.complete({ messages: [{ role: "user", content: prompt }], max_tokens: 600 });
      variants = JSON.parse(raw.replace(/```json|```/g, "").trim());
    } else {
      throw new Error("no_ai");
    }
    if (!Array.isArray(variants) || !variants.length) throw new Error("empty");
    seedPending = variants.slice(0, 3).map(v => ({
      text: String(v.text || "").trim(),
      vibe: v.vibe === "deep" ? "deep" : "playful"
    })).filter(v => v.text);
    if (!seedPending.length) throw new Error("empty");
    addBusy = false;
    renderAddPanel();
  } catch (e) {
    addBusy = false;
    seedPending = null;
    renderAddPanel();
    const eEl = el("addError");
    if (eEl) eEl.textContent = e.message === "no_ai"
      ? "Set WORKER_URL to enable AI seeding."
      : "Couldn't reach the question writer. Your idea is still there.";
  }
}

function pickVariant(idx) {
  if (!seedPending || !seedPending[idx]) return;
  const v = seedPending[idx];
  // stash seed text before clearing
  const ta = el("addTextarea"); // may be gone after render; grab now
  const seedText = ta ? ta.value.trim() : "";
  seedPending = null;
  addBusy = false;
  addPanelMode = "manual"; // switch to manual so user can confirm / edit
  renderAddPanel();
  // pre-fill textarea and vibe
  const newTa = el("addTextarea");
  if (newTa) newTa.value = v.text;
  const vibeM = el("addVibeManual");
  if (vibeM) vibeM.value = v.vibe;
  // stash seed for commit
  el("addPanelHost").dataset.seed = seedText;
}

  // manual mode

/* ---------------- swipe gesture ---------------- */
let drag = null;
let dragRaf = null;

function paintSwipe(d, dx, animate) {
  const t = Math.max(-1, Math.min(1, dx / 120));
  d.card.style.transition = animate ? "transform 260ms cubic-bezier(0.2,0.8,0.25,1)" : "none";
  d.card.style.transform = "translateX(" + dx + "px) rotate(" + (t * 5).toFixed(2) + "deg)";
  if (d.passEl) d.passEl.style.opacity = String(Math.max(0, -t));
  if (d.saveEl) d.saveEl.style.opacity = String(Math.max(0, t));
}

function flingOut(d, dir, then) {
  d.card.style.transition = "transform 220ms ease-in, opacity 220ms ease-in";
  d.card.style.transform = "translateX(" + (dir * 520) + "px) rotate(" + (dir * 14) + "deg)";
  d.card.style.opacity = "0";
  setTimeout(then, 200);
}

function onCardPointerDown(e) {
  if (e.target.closest && e.target.closest("button")) return;
  const card = e.currentTarget;
  drag = {
    id: e.pointerId, x: e.clientX, y: e.clientY, active: false, buzzed: 0, pending: 0,
    card, passEl: card.querySelector(".qd-pass"), saveEl: card.querySelector(".qd-save")
  };
  if (card.setPointerCapture) { try { card.setPointerCapture(e.pointerId); } catch (err) {} }
}

function onCardPointerMove(e) {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.active) {
    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
    drag.active = true;
  }
  const past = Math.abs(dx) > 100 ? Math.sign(dx) : 0;
  if (past && past !== drag.buzzed) { buzz(8); drag.buzzed = past; }
  if (!past) drag.buzzed = 0;
  drag.pending = dx;
  if (dragRaf == null) {
    dragRaf = requestAnimationFrame(() => {
      dragRaf = null;
      if (drag) paintSwipe(drag, drag.pending, false);
    });
  }
}

function onCardPointerUp(e) {
  if (!drag || drag.id !== e.pointerId) return;
  const d = drag; drag = null;
  if (dragRaf != null) { cancelAnimationFrame(dragRaf); dragRaf = null; }
  if (!d.active) { paintSwipe(d, 0, true); return; }
  const dx = e.clientX - d.x;
  if (dx < -100) {
    buzz([12, 40, 12]);
    flingOut(d, -1, () => back());
  } else if (dx > 100) {
    buzz(18);
    flingOut(d, 1, () => next());
  } else {
    paintSwipe(d, 0, true);
  }
}

    el("secondaryRow").classList.toggle("cols-2", CAN_GENERATE);
    el("secondaryRow").classList.toggle("cols-1", !CAN_GENERATE);
    el("genBtn").disabled = busy;
    el("genLabel").textContent = busy ? "Writing…" : "Write new ones";
    el("addToggleBtn").textContent = addPanelOpen ? "✕ Close" : "+ Add a question";
    if (lastPass) {
      el("note").innerHTML = esc(note) + ' <button type="button" class="btn btn-ghost" id="undoPassBtn" style="padding:2px 6px;">Undo</button>';
      el("undoPassBtn").onclick = () => withTransition(undoPass);
    } else {
      el("note").textContent = note;
    }
    el("counter").textContent = (pool(null).length + (current ? 1 : 0)) +
      " of " + poolTotal() + " left in " + vibeLabel(state.vibe);
    renderAddPanel();
  }
  if (savedVisible) { renderSaved(); renderMyQuestions(); }
}

/* ---------------- wire up ---------------- */
el("nextBtn").onclick = () => { buzz(8); withTransition(next); };
el("passBtn").onclick = () => { buzz(8); withTransition(pass); };
el("genBtn").onclick = generate;
el("reshuffleBtn").onclick = () => withTransition(reshuffle);
el("addToggleBtn").onclick = toggleAddPanel;
el("toggleView").onclick = () => { view = "saved"; render(); };
el("backBtn").onclick = () => { view = "deck"; render(); };

document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (!isWide && view !== "deck") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); buzz(8); withTransition(next); }
  if (e.key === "ArrowLeft") { e.preventDefault(); buzz(8); withTransition(back); }
  if (e.key === "s") toggleSave();
});

const mq = window.matchMedia("(min-width: 860px)");
const applyWide = () => { isWide = mq.matches; render(); };
mq.addEventListener ? mq.addEventListener("change", applyWide) : mq.addListener(applyWide);

try {
  standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
} catch (e) {}

(async function init() {
  const saved = await store.load();
  if (saved) state = Object.assign(state, saved);
  if (!Array.isArray(state.custom)) state.custom = [];
  isWide = mq.matches;
  draw(null);
})();
</script>
</body>
</html>
