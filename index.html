:root {
  --ink: #171D2B;
  --ink-2: #10141F;
  --paper: #F4ECE0;
  --paper-2: #E4D7C5;
  --honey: #E0A34E;
  --sage: #7FA292;
  --muted: #8A93A6;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  min-height: 100svh;
  background: radial-gradient(120% 90% at 50% 0%, #202940 0%, var(--ink) 45%, var(--ink-2) 100%);
  background-attachment: fixed;
  color: var(--paper);
  font-family: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
  -webkit-font-smoothing: antialiased;
}
.shell { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 20px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.linkbtn {
  background: none; border: none; padding: 0; cursor: pointer; white-space: nowrap;
  font-family: inherit; font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--paper-2); opacity: 0.8;
}
.linkbtn:hover { opacity: 1; }

.vibes {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: rgba(255,255,255,0.05); padding: 4px; border-radius: 999px;
}
.vibe {
  border: none; background: none; cursor: pointer; padding: 9px 0; border-radius: 999px;
  font-family: inherit; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); transition: background 160ms ease, color 160ms ease;
}
.vibe[data-on="true"] { background: var(--paper); color: var(--ink); }

.stack { position: relative; padding-bottom: 14px; }
.ghost { position: absolute; inset: 0 0 auto 0; height: 100%; border-radius: 16px; background: var(--paper-2); }
.ghost.g1 { transform: translateY(7px) scale(0.975); opacity: 0.34; }
.ghost.g2 { transform: translateY(14px) scale(0.95); opacity: 0.18; }

.card {
  position: relative; background: var(--paper); color: var(--ink);
  border-radius: 16px; padding: 26px 24px 24px; min-height: 250px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 22px 44px rgba(0,0,0,0.42);
  animation: rise 420ms cubic-bezier(0.2, 0.8, 0.25, 1);
}
@keyframes rise {
  from { transform: translateY(16px) rotate(-0.6deg); opacity: 0; }
  to { transform: none; opacity: 1; }
}
.cardtop { display: flex; align-items: center; justify-content: space-between; }
.tag {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  display: flex; align-items: center; gap: 7px; color: #5C5344;
}
.dot { width: 7px; height: 7px; border-radius: 50%; }
.star {
  background: none; border: none; cursor: pointer; padding: 2px 0 2px 12px;
  font-size: 19px; line-height: 1; color: #C0B4A2; transition: transform 140ms ease;
}
.star[data-on="true"] { color: var(--honey); }
.star:active { transform: scale(0.86); }

.q {
  font-family: "Newsreader", Georgia, serif; font-weight: 300;
  font-size: 27px; line-height: 1.28; letter-spacing: -0.01em;
  margin: 26px 0 22px; color: #1A2030; text-wrap: balance;
}
.rule { height: 1px; background: rgba(26,32,48,0.14); }
.foot {
  display: flex; justify-content: space-between; padding-top: 12px;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A705F;
}

.actions { display: flex; flex-direction: column; gap: 9px; }
.next {
  width: 100%; border: none; cursor: pointer; border-radius: 12px; padding: 16px;
  background: var(--paper); color: var(--ink); font-family: inherit;
  font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
  transition: transform 120ms ease;
}
.next:active { transform: translateY(1px); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.row.one { grid-template-columns: 1fr; }
.ghostbtn {
  border: 1px solid rgba(244,236,224,0.22); background: none; color: var(--paper-2);
  border-radius: 12px; padding: 13px; cursor: pointer; font-family: inherit;
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
}
.ghostbtn:hover { border-color: rgba(244,236,224,0.45); }
.ghostbtn:disabled { opacity: 0.4; cursor: default; }

.note { font-size: 11px; color: var(--muted); text-align: center; min-height: 30px; line-height: 1.5; }
.meta {
  display: flex; justify-content: space-between; font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}

.empty {
  background: rgba(255,255,255,0.04); border: 1px dashed rgba(244,236,224,0.22);
  border-radius: 16px; padding: 34px 24px; text-align: center;
}
.empty p { font-family: "Newsreader", Georgia, serif; font-size: 21px; font-weight: 300; margin: 0 0 18px; }

.saved-list { display: flex; flex-direction: column; gap: 10px; }
.saveditem {
  background: rgba(255,255,255,0.045); border-radius: 12px; padding: 14px 15px;
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
}
.savedtext { font-family: "Newsreader", Georgia, serif; font-size: 17px; font-weight: 300; line-height: 1.35; }
.x { background: none; border: none; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 15px; line-height: 1; padding: 0 2px; }
.x:hover { color: var(--paper); }

.hidden { display: none !important; }
button:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }

.setuplink {
  align-self: center; margin-top: 4px; text-decoration: none;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid rgba(138,147,166,0.35); padding-bottom: 3px;
}
.setuplink:hover { color: var(--paper-2); border-color: rgba(228,215,197,0.5); }
@media (display-mode: standalone) { .setuplink { display: none; } }

@media (max-width: 380px) {
  .q { font-size: 24px; }
  .vibe { font-size: 10px; letter-spacing: 0.05em; }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  * { transition: none !important; }
}
</style>
</head>

const BASE = RAW.map((r, i) => ({ id: "b" + i, text: r[0], vibe: r[1], topic: r[2] || null }));
const KEY = "question-deck-v1";
const CAN_GENERATE = typeof window.storage !== "undefined";

/* ---------------- storage ---------------- */
const store = {
  async load() {
    if (window.storage) {
      try { const r = await window.storage.get(KEY); return r && r.value ? JSON.parse(r.value) : null; }
      catch (e) { return null; }
    }
    try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  },
  async save(obj) {
    const s = JSON.stringify(obj);
    if (window.storage) { try { await window.storage.set(KEY, s); } catch (e) {} return; }
    try { localStorage.setItem(KEY, s); } catch (e) {}
  }
};

/* ---------------- state ---------------- */
let state = { vibe: "mixed", generated: [], used: [], retired: [], saved: [] };
let current = null;
let view = "deck";
let busy = false;
let note = "";

const all = () => BASE.concat(state.generated);
const persist = () => store.save(state);

function matches(q, v) {
  if (v === "mixed") return true;
  if (v === "music") return q.topic === "music";
  return q.vibe === v;
}

function pool(excludeId) {
  return all().filter(q =>
    matches(q, state.vibe) &&
    state.used.indexOf(q.id) === -1 &&
    state.retired.indexOf(q.id) === -1 &&
    q.id !== excludeId
  );
}

function draw(excludeId) {
  const p = pool(excludeId);
  if (!p.length) { current = null; render(); return; }
  current = p[Math.floor(Math.random() * p.length)];
  if (state.used.indexOf(current.id) === -1) state.used.push(current.id);
  persist();
  render();
}

/* ---------------- actions ---------------- */
function setVibe(v) {
  state.vibe = v;
  if (!current || !matches(current, v)) draw(null);
  else { persist(); render(); }
}

function next() { note = ""; draw(current ? current.id : null); }

function pass() {
  if (!current) return;
  state.retired.push(current.id);
  state.saved = state.saved.filter(s => s.id !== current.id);
  note = "Passed. That one is out of the deck for good.";
  draw(current.id);
}

function toggleSave() {
  if (!current) return;
  const on = state.saved.some(s => s.id === current.id);
  if (on) {
    state.saved = state.saved.filter(s => s.id !== current.id);
    note = "Removed from saved.";
  } else {
    state.saved.push({ id: current.id, text: current.text, vibe: current.vibe });
    note = CAN_GENERATE ? "Saved. New questions will lean this direction." : "Saved.";
  }
  persist(); render();
}

function reshuffle() {
  state.used = [];
  note = "Deck reshuffled. Everything you didn't pass is back in play.";
  draw(null);
}

async function generate() {
  busy = true; note = ""; render();
  const taste = state.saved.slice(-10).map(s => s.text);
  const recent = state.used.map(id => all().find(q => q.id === id)).filter(Boolean).slice(-25).map(q => q.text);
  const vibeLine = state.vibe === "playful"
    ? "Light, funny, curious. Nothing heavy."
    : state.vibe === "deep"
      ? "Reflective and revealing, the kind that opens a long conversation."
      : state.vibe === "music"
        ? "Every question must be about music. Songs, albums, concerts, artists, what music does to them, what it meant at different points in their life. Mix light ones with a few that go deep."
        : "Half light and funny, half reflective and revealing.";

  const prompt = [
    "You write open ended questions for a married couple doing a Gottman informed check in. They take turns asking each other one question at a time.",
    "", "Generate 8 new questions.", "Vibe: " + vibeLine, "", "Rules:",
    "- Open ended. Never answerable with yes or no.",
    "- One sentence, addressed to the partner as you.",
    "- Specific and vivid, not generic self help phrasing.",
    "- No therapy jargon, no clinical language, no em dashes.",
    "- Fun ones should be genuinely funny, not cute.",
    taste.length ? "\nThe couple saved these as favorites. Match this taste:\n" + taste.map(t => "- " + t).join("\n") : "",
    recent.length ? "\nDo not repeat or closely mirror these:\n" + recent.map(t => "- " + t).join("\n") : "",
    "", 'Return only a JSON array, no preamble and no markdown: [{"text": "...", "vibe": "playful"}]',
    'vibe must be either "playful" or "deep".'
  ].join("\n");

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] })
    });
    const data = await res.json();
    const text = data.content.filter(c => c.type === "text").map(c => c.text).join("\n").replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(text);
    const stamp = Date.now();
    const fresh = parsed.filter(q => q && typeof q.text === "string").map((q, i) => ({
      id: "g" + stamp + "-" + i,
      text: q.text.trim(),
      vibe: q.vibe === "deep" ? "deep" : "playful",
      topic: state.vibe === "music" ? "music" : null,
      fresh: true
    }));
    if (!fresh.length) throw new Error("empty");
    state.generated = state.generated.concat(fresh);
    const match = fresh.filter(q => matches(q, state.vibe));
    current = (match.length ? match : fresh)[0];
    state.used.push(current.id);
    note = "Added " + fresh.length + " fresh questions to the deck.";
    persist();
  } catch (e) {
    note = "Couldn't reach the question writer. Check your connection and try again.";
  }
  busy = false; render();
}

/* ---------------- render ---------------- */
const el = id => document.getElementById(id);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function renderVibes() {
  const opts = [["playful", "Playful"], ["mixed", "Mixed"], ["deep", "Deep"], ["music", "Music"]];
  el("vibes").innerHTML = opts.map(o =>
    '<button class="vibe" data-on="' + (state.vibe === o[0]) + '" data-v="' + o[0] + '">' + o[1] + '</button>'
  ).join("");
  Array.prototype.forEach.call(el("vibes").children, b => {
    b.onclick = () => setVibe(b.getAttribute("data-v"));
  });
}

function renderCard() {
  const host = el("cardHost");
  if (!current) {
    host.innerHTML =
      '<div class="empty"><p>You have been through every question in this vibe.</p>' +
      '<div class="row' + (CAN_GENERATE ? '' : ' one') + '">' +
      '<button class="ghostbtn" id="emptyShuffle">Reshuffle</button>' +
      (CAN_GENERATE ? '<button class="ghostbtn" id="emptyGen">Write new ones</button>' : '') +
      '</div></div>';
    el("emptyShuffle").onclick = reshuffle;
    if (CAN_GENERATE) el("emptyGen").onclick = generate;
    return;
  }
  const on = state.saved.some(s => s.id === current.id);
  const accent = current.vibe === "deep" ? "var(--sage)" : "var(--honey)";
  const left = pool(null).length + 1;
  host.innerHTML =
    '<div class="stack"><div class="ghost g2"></div><div class="ghost g1"></div>' +
    '<div class="card"><div class="cardtop">' +
    '<span class="tag"><span class="dot" style="background:' + accent + '"></span>' +
    (state.vibe === "music" ? "All about music" : current.vibe === "deep" ? "Goes deep" : "Keeps it light") + '</span>' +
    '<button class="star" id="starBtn" data-on="' + on + '" aria-label="Save this question">' + (on ? "\u2605" : "\u2606") + '</button>' +
    '</div><p class="q">' + esc(current.text) + '</p>' +
    '<div><div class="rule"></div><div class="foot"><span>' +
    (current.fresh ? "Freshly written" : "From the deck") + '</span><span>' + left + ' left</span></div></div>' +
    '</div></div>';
  el("starBtn").onclick = toggleSave;
}

function renderSaved() {
  const host = el("savedView");
  if (!state.saved.length) {
    host.innerHTML = '<div class="empty"><p>Nothing saved yet.</p><span class="eyebrow">' +
      (CAN_GENERATE ? "Star the ones that land. New questions get written in their image." : "Star the ones that land so you can come back to them.") +
      '</span></div>';
    return;
  }
  host.innerHTML = '<div class="saved-list">' + state.saved.map(s =>
    '<div class="saveditem"><span class="savedtext">' + esc(s.text) +
    '</span><button class="x" data-id="' + s.id + '" aria-label="Remove">\u2715</button></div>'
  ).join("") + '</div>';
  Array.prototype.forEach.call(host.querySelectorAll(".x"), b => {
    b.onclick = () => {
      state.saved = state.saved.filter(s => s.id !== b.getAttribute("data-id"));
      persist(); render();
    };
  });
}

function render() {
  el("toggleView").textContent = view === "deck" ? "Saved (" + state.saved.length + ")" : "Back to deck";
  el("deckView").classList.toggle("hidden", view !== "deck");
  el("savedView").classList.toggle("hidden", view !== "saved");
  if (view === "deck") {
    renderVibes();
    renderCard();
    el("passBtn").disabled = !current;
    el("genBtn").disabled = busy;
    el("genBtn").textContent = busy ? "Writing..." : "Write new ones";
    el("genBtn").classList.toggle("hidden", !CAN_GENERATE);
    el("secondaryRow").classList.toggle("one", !CAN_GENERATE);
    el("note").textContent = note;
    el("counter").textContent = CAN_GENERATE
      ? state.generated.length + " written for you"
      : all().length + " questions total";
  } else {
    renderSaved();
  }
}

/* ---------------- wire up ---------------- */
el("nextBtn").onclick = next;
el("passBtn").onclick = pass;
el("genBtn").onclick = generate;
el("reshuffleBtn").onclick = reshuffle;
el("toggleView").onclick = () => { view = view === "deck" ? "saved" : "deck"; render(); };

document.addEventListener("keydown", e => {
  if (view !== "deck") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  if (e.key === "s") toggleSave();
});

(async function init() {
  const saved = await store.load();
  if (saved) state = Object.assign(state, saved);
  draw(null);
})();
</script>
