name = "question-deck-ai"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
# Comma-separated list of origins allowed to call this Worker.
# Must exactly match the Origin header the browser sends (no trailing slash).
ALLOWED_ORIGINS = "https://sdiasuez11.github.io"
# Maximum AI generation calls per UTC day across both /seed and /batch.
DAILY_CAP = "50"

[[kv_namespaces]]
binding = "RATE_LIMIT"
# After `wrangler kv namespace create RATE_LIMIT`, paste the returned id here:
id = "REPLACE_WITH_KV_NAMESPACE_ID"
